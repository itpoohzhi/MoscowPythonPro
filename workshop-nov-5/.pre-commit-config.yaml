repos:
  - repo: local
    hooks:
      - id: verify-architecture-layers
        name: AST Layer Boundary Linter
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)/workshop-nov-5" && python3 tools/verify_architecture_layers.py'
        language: system
        pass_filenames: false
        always_run: true
      - id: verify-kb-sync
        name: Knowledge Base Sync Verifier
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)/workshop-nov-5" && python3 tools/verify_kb_sync.py'
        language: system
        pass_filenames: false
        always_run: true
