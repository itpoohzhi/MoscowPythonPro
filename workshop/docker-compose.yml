name: ai-python-workshop

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 10

  dev:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    working_dir: /repo/workshop
    volumes:
      - ..:/repo
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_NO_SYNC: "1"
    ports:
      - "${APP_PORT:-8000}:8000"
    tty: true
    stdin_open: true

volumes:
  pgdata:
